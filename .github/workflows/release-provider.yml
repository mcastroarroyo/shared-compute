name: release-provider

# Prebuilt provider-daemon binaries for the "Share your computer" one-liner.
# Trigger: push a tag like `provider-v0.1.0`, or run manually.

on:
  push:
    tags: ["provider-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple silicon
            asset: provider-daemon-darwin-arm64
          - os: ubuntu-latest   # x86_64 Linux
            asset: provider-daemon-linux-x64
          - os: windows-latest  # x86_64 Windows
            asset: provider-daemon-windows-x64.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: provider-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: provider-core
      - name: Install CMake / Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress -y
      - name: Build
        run: cargo build --release --bin provider-daemon --features llama
      - name: Stage asset
        shell: bash
        run: |
          bin=target/release/provider-daemon
          [ "${{ runner.os }}" = "Windows" ] && bin="$bin.exe"
          cp "$bin" "../${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Publish / update the release(s)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Prebuilt provider-daemon with embedded llama.cpp. Used by the Share your computer installer."
          publish() {
            local tag="$1" extra="$2"
            # Upload in place so the installer never sees a window without assets
            # (delete+create used to 404 anyone installing during the publish).
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"
              gh release edit "$tag" --notes "$notes ($(date -u +%Y-%m-%dT%H:%MZ), $GITHUB_SHA)" --repo "$GITHUB_REPOSITORY"
            else
              gh release create "$tag" dist/* \
                --repo "$GITHUB_REPOSITORY" \
                --title "provider-daemon ($tag)" \
                --notes "$notes" \
                --latest=false
            fi
          }
          # The installer always pulls from the rolling `provider-latest` release,
          # so every run refreshes it (git tag recreated to match). A version tag
          # also gets its own release, leaving the immutable git tag in place.
          publish provider-latest --cleanup-tag
          case "${GITHUB_REF_NAME:-}" in
            provider-v*) publish "$GITHUB_REF_NAME" "" ;;
          esac
