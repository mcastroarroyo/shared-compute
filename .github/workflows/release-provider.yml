name: release-provider

# Prebuilt provider-daemon binaries for the "Share your computer" one-liner.
# Trigger: push a tag like `provider-v0.1.0`, or run manually.

on:
  push:
    tags: ["provider-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple silicon
            asset: provider-daemon-darwin-arm64
          - os: ubuntu-latest   # x86_64 Linux
            asset: provider-daemon-linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: provider-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: provider-core
      - name: Install CMake / Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Build
        run: cargo build --release --bin provider-daemon --features llama
      - name: Stage asset
        run: cp target/release/provider-daemon "../${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Publish / update the release(s)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Prebuilt provider-daemon with embedded llama.cpp. Used by the Share your computer installer."
          publish() {
            local tag="$1" extra="$2"
            gh release delete "$tag" --yes $extra --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
            gh release create "$tag" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "provider-daemon ($tag)" \
              --notes "$notes" \
              --latest=false
          }
          # The installer always pulls from the rolling `provider-latest` release,
          # so every run refreshes it (git tag recreated to match). A version tag
          # also gets its own release, leaving the immutable git tag in place.
          publish provider-latest --cleanup-tag
          case "${GITHUB_REF_NAME:-}" in
            provider-v*) publish "$GITHUB_REF_NAME" "" ;;
          esac
