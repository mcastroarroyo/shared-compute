name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install check-jsonschema
      - run: ./scripts/validate-schemas.sh

  no-prompt-logging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-no-prompt-logging.sh

  coordinator:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sc
          POSTGRES_PASSWORD: sc
          POSTGRES_DB: sharedcompute_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sc" --health-interval 5s
          --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: coordinator
    env:
      SC_TEST_DATABASE_URL: postgres://sc:sc@localhost:5432/sharedcompute_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: coordinator/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  provider-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: provider-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: provider-core
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  e2e:
    runs-on: ubuntu-latest
    needs: [coordinator, provider-core]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: coordinator/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: provider-core
      - run: ./e2e-tests/run.sh

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: site
        run: npm install
      - working-directory: site
        run: npm run build
