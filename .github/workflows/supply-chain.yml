name: supply-chain
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "17 6 * * 1" }]   # weekly re-scan for newly published advisories
permissions: { contents: read }
jobs:
  govulncheck:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: coordinator } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27", cache-dependency-path: coordinator/go.sum }
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
  cargo-audit:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: provider-core } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: provider-core }
      - run: cargo install cargo-audit --locked
      - run: cargo audit
  npm-audit:
    runs-on: ubuntu-latest
    strategy: { matrix: { dir: [site, webapp, demo, console] } }
    defaults: { run: { working-directory: ${{ matrix.dir }} } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      # Static exports ship no server deps; fail only on high/critical in the shipped tree.
      - run: npm audit --omit=dev --audit-level=high
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
  python-audit:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: security } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --disable-pip-version-check -r requirements.txt pip-audit
      - run: python -m pip_audit -r requirements.txt
