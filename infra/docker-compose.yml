# Local full-stack for development.
#   docker compose -f infra/docker-compose.yml up --build
#
# `coordinator` + `postgres` come up by default. `minio` (the R2 stand-in) is behind the
# "m3" profile until the model registry work.

services:
  coordinator:
    build:
      context: ..
      dockerfile: infra/coordinator.Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SC_HTTP_ADDR: ":8080"
      SC_CONSUMER_API_KEYS: "dev-consumer-key"
      SC_PROVIDER_TOKENS: "dev-provider-token"
      SC_HEARTBEAT_SECONDS: "15"
      SC_DATABASE_URL: "postgres://sc:sc@postgres:5432/sharedcompute?sslmode=disable"
      SC_DEBUG: "1"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sc
      POSTGRES_PASSWORD: sc
      POSTGRES_DB: sharedcompute
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sc"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    profiles: ["m3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sc
      MINIO_ROOT_PASSWORD: sc-secret-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
