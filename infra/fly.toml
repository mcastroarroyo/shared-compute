# Fly.io deployment for the coordinator.
#   fly launch --no-deploy --copy-config --name <app>    # first time, from repo root
#   fly secrets set SC_CONSUMER_API_KEYS=... SC_PROVIDER_TOKENS=... SC_DATABASE_URL=...
#   fly deploy
#
# App name and primary region are set by `fly launch`; the placeholders below are
# overwritten there.

app = "shared-compute-coordinator"
primary_region = "iad"

[build]
  dockerfile = "infra/coordinator.Dockerfile"

[env]
  SC_HTTP_ADDR = ":8080"
  SC_HEARTBEAT_SECONDS = "15"
  # Secrets (NOT here): SC_CONSUMER_API_KEYS, SC_PROVIDER_TOKENS, SC_DATABASE_URL,
  # SC_MANIFEST_URL

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"      # long-lived provider WebSockets must not be culled
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 2000
    soft_limit = 1800

[[http_service.checks]]
  interval = "15s"
  timeout = "3s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
