[package]
name = "provider-lib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
llama = ["sc-inference/llama"]
vulkan = ["llama", "sc-inference/vulkan"]

[dependencies]
sc-protocol = { path = "../sc-protocol" }
sc-crypto = { path = "../sc-crypto" }
sc-manifest = { path = "../sc-manifest" }
sc-net = { path = "../sc-net" }
sc-models = { path = "../sc-models" }
sc-inference = { path = "../sc-inference" }
sc-telemetry = { path = "../sc-telemetry" }
sc-attest = { path = "../sc-attest" }

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tokio-util.workspace = true
futures-util.workspace = true
tracing.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
crypto_box.workspace = true
