[package]
name = "sc-modelctl"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "LicenseRef-Proprietary-Placeholder"
description = "Build and sign the shared-compute model manifest"

[[bin]]
name = "sc-modelctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
# ed25519 signing wired up in M3
