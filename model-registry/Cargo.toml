[package]
name = "sc-modelctl"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "LicenseRef-Proprietary-Placeholder"
description = "Build and sign the shared-compute model registry manifest"

[[bin]]
name = "sc-modelctl"
path = "src/main.rs"

[dependencies]
sc-manifest = { path = "../provider-core/sc-manifest" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
time = { version = "0.3", features = ["formatting"] }
